# Zerexa Video App — Auto Build & Release (native Flutter, 4 platforms)
# ---------------------------------------------------------------------------
# Outputs (all built from the SAME Flutter codebase, no WebView shell):
#   - zerexa-video-android-universal-<ver>.apk  Android APK
#   - zerexa-video-ios-unsigned-<ver>.ipa       iOS IPA (unsigned, sideload)
#   - zerexa-video-linux-x64-<ver>.tar.gz       Linux x64 bundle (executable inside)
#   - zerexa-video-windows-x64-<ver>.zip        Windows x64 bundle (ZerexaVideo.exe inside)
#   - SHA256SUMS.txt
#
# Triggers:
#   - push to main  (no v* tag) -> pre-release, version = 0.0.0-pre.<sha6>, tag = pre-<sha6>
#   - push v* tag                  -> normal release, version = tag name, becomes latest
#   - workflow_dispatch            -> manual, choose release / prerelease
# ---------------------------------------------------------------------------

name: Build & Release

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: false
        default: 'prerelease'
        type: choice
        options: [prerelease, release]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.47.1'

jobs:
  # -----------------------------------------------------------------------
  # Compute release metadata once and fan out
  # -----------------------------------------------------------------------
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      release_name: ${{ steps.meta.outputs.release_name }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      is_release: ${{ steps.meta.outputs.is_release }}
      commit_short: ${{ steps.meta.outputs.commit_short }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Compute release metadata
        id: meta
        run: |
          set -euo pipefail
          IS_RELEASE="false"; IS_PRERELEASE="true"
          VERSION=""; TAG_NAME=""; RELEASE_NAME=""

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            INPUT_TYPE="${{ github.event.inputs.release_type }}"
            SHORT="${GITHUB_SHA:0:6}"
            if [ "$INPUT_TYPE" = "release" ]; then
              IS_RELEASE="true"; IS_PRERELEASE="false"
              VERSION="manual-${SHORT}"; TAG_NAME="manual-${SHORT}"
              RELEASE_NAME="Zerexa Video App (manual) ${VERSION}"
            else
              VERSION="0.0.0-pre.${SHORT}"; TAG_NAME="pre-${SHORT}"
              RELEASE_NAME="Zerexa Video App Pre-release ${SHORT}"
            fi
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            IS_RELEASE="true"; IS_PRERELEASE="false"
            VERSION="${GITHUB_REF#refs/tags/}"; TAG_NAME="${VERSION}"
            RELEASE_NAME="Zerexa Video App ${VERSION}"
          else
            SHORT="${GITHUB_SHA:0:6}"
            VERSION="0.0.0-pre.${SHORT}"; TAG_NAME="pre-${SHORT}"
            RELEASE_NAME="Zerexa Video App Pre-release ${SHORT}"
          fi

          echo "version=${VERSION}"          >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}"        >> "$GITHUB_OUTPUT"
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          echo "is_release=${IS_RELEASE}"    >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "commit_short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

          {
            echo "## Release metadata"
            echo "| key | value |"
            echo "|-----|-------|"
            echo "| event | ${{ github.event_name }} |"
            echo "| ref | ${GITHUB_REF} |"
            echo "| version | ${VERSION} |"
            echo "| tag | ${TAG_NAME} |"
            echo "| prerelease | ${IS_PRERELEASE} |"
            echo "| commit | ${GITHUB_SHA:0:7} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # -----------------------------------------------------------------------
  # Android APK (universal, arm64+v7+x64 in one)
  # -----------------------------------------------------------------------
  build-android:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build APK
        run: |
          flutter build apk --release \
            --build-name="${{ needs.meta.outputs.version }}" \
            --build-number="${{ github.run_number }}" \
            --dart-define=APP_VERSION="${{ needs.meta.outputs.version }}"

      - name: Collect artifact
        run: |
          mkdir -p artifacts
          cp build/app/outputs/flutter-apk/app-release.apk \
            "artifacts/zerexa-video-android-universal-${{ needs.meta.outputs.version }}.apk"
          cd artifacts
          sha256sum *.apk > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            artifacts/zerexa-video-android-universal-*.apk
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  # -----------------------------------------------------------------------
  # Linux x64 (executable bundle: ./zerexa-video/zerexa_video)
  # -----------------------------------------------------------------------
  build-linux:
    needs: meta
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev libblkid-dev liblzma-dev \
            libmpv-dev mpv zenity

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build Linux
        run: |
          flutter build linux --release \
            --dart-define=APP_VERSION="${{ needs.meta.outputs.version }}"

      - name: Package bundle
        run: |
          mkdir -p artifacts/zerexa-video
          cp -r build/linux/x64/release/bundle/* artifacts/zerexa-video/
          chmod +x artifacts/zerexa-video/zerexa_video
          cd artifacts
          tar -czf "zerexa-video-linux-x64-${{ needs.meta.outputs.version }}.tar.gz" zerexa-video
          rm -rf zerexa-video
          sha256sum *.tar.gz > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: linux-bundle
          path: |
            artifacts/zerexa-video-linux-x64-*.tar.gz
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  # -----------------------------------------------------------------------
  # Windows x64 (ZerexaVideo.exe + runtime inside zip)
  # -----------------------------------------------------------------------
  build-windows:
    needs: meta
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build Windows
        run: |
          flutter build windows --release `
            --dart-define=APP_VERSION="${{ needs.meta.outputs.version }}"

      - name: Package bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/zerexa-video | Out-Null
          Copy-Item -Recurse -Force build/windows/x64/runner/Release/* artifacts/zerexa-video/
          Compress-Archive -Path artifacts/zerexa-video `
            -DestinationPath "artifacts/zerexa-video-windows-x64-${{ needs.meta.outputs.version }}.zip"
          Remove-Item -Recurse -Force artifacts/zerexa-video
          Get-ChildItem artifacts
          $hashes = Get-FileHash artifacts/*.zip -Algorithm SHA256 | `
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" }
          $hashes | Out-File -Encoding ascii artifacts/SHA256SUMS.txt
          Get-Content artifacts/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: windows-bundle
          path: |
            artifacts/zerexa-video-windows-x64-*.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  # -----------------------------------------------------------------------
  # iOS IPA (unsigned, sideload via TrollStore / AltStore / Sideloadly)
  # -----------------------------------------------------------------------
  build-ios:
    needs: meta
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Pub get
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign \
            --build-name="${{ needs.meta.outputs.version }}" \
            --build-number="${{ github.run_number }}" \
            --dart-define=APP_VERSION="${{ needs.meta.outputs.version }}"

      - name: Package unsigned IPA
        run: |
          mkdir -p artifacts/Payload
          cp -R build/ios/iphoneos/Runner.app artifacts/Payload/
          cd artifacts
          zip -qr "zerexa-video-ios-unsigned-${{ needs.meta.outputs.version }}.ipa" Payload
          rm -rf Payload
          shasum -a 256 *.ipa > SHA256SUMS.txt
          ls -lh
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: |
            artifacts/zerexa-video-ios-unsigned-*.ipa
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

  # -----------------------------------------------------------------------
  # Publish GitHub Release with all 4 native artifacts
  # -----------------------------------------------------------------------
  release:
    needs: [meta, build-android, build-linux, build-windows, build-ios]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: false

      - name: Flatten assets into a single dir
        run: |
          mkdir -p flat
          find release-assets -type f \( \
            -name '*.apk' -o \
            -name '*.ipa' -o \
            -name '*.tar.gz' -o \
            -name '*.zip' -o \
            -name 'SHA256SUMS.txt' \
          \) -exec cp {} flat/ \;
          ls -lh flat/
          # Generate a combined SHA256SUMS for the release
          cd flat
          rm -f SHA256SUMS.txt
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Generate release notes
        run: |
          VERSION="${{ needs.meta.outputs.version }}"
          TAG_NAME="${{ needs.meta.outputs.tag_name }}"
          COMMIT_FULL="${{ github.sha }}"
          COMMIT_SHORT="${{ needs.meta.outputs.commit_short }}"
          IS_RELEASE="${{ needs.meta.outputs.is_release }}"

          LAST_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || \
                     git tag -l --sort=-version:refname | grep -v "^${TAG_NAME}$" | head -n1 || true)

          if [ -n "$LAST_TAG" ]; then
            COMMIT_LIST_TITLE="本次更新 (自 \`${LAST_TAG}\`)"
            COMMIT_LIST=$(git log --pretty=format:'- %s (%h)' "${LAST_TAG}..HEAD" 2>/dev/null | head -100 || true)
          else
            COMMIT_LIST_TITLE="本次提交"
            COMMIT_LIST=$(git log --pretty=format:'- %s (%h)' -n 100)
          fi

          if [ "$IS_RELEASE" = "true" ]; then
            HEADER_LINE="正式发布版本。构建自 commit \`${COMMIT_SHORT}\`。"
            PRE_NOTE="稳定版本，可作为日常使用。"
          else
            HEADER_LINE="**版本号:** \`${VERSION}\`  "
            HEADER_LINE="${HEADER_LINE}  **Commit:** [\`${COMMIT_SHORT}\`](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${COMMIT_FULL})  "
            HEADER_LINE="${HEADER_LINE}  **Tag:** \`${TAG_NAME}\`"
            PRE_NOTE="这是基于 \`main\` 分支最新 commit 的自动化预发布构建，不保证稳定。需要稳定版本请使用 [\`v* tag\`](../../releases/latest) 的 release。"
          fi

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          # Write each substitution value to a file (avoids all bash quoting issues),
          # then let python do the placeholder swap.
          mkdir -p /tmp/rn
          printf '%s' "$VERSION"              > /tmp/rn/version
          printf '%s' "$HEADER_LINE"          > /tmp/rn/header_line
          printf '%s' "$PRE_NOTE"             > /tmp/rn/pre_note
          printf '%s' "$COMMIT_LIST_TITLE"    > /tmp/rn/commit_list_title
          printf '%s' "$COMMIT_LIST"          > /tmp/rn/commit_list
          printf '%s' "$GITHUB_RUN_NUMBER"    > /tmp/rn/run_number
          printf '%s' "$RUN_URL"              > /tmp/rn/run_url

          python3 scripts/render-release-notes.py \
            scripts/release-notes-template.md \
            release-notes.md \
            /tmp/rn/version \
            /tmp/rn/header_line \
            /tmp/rn/pre_note \
            /tmp/rn/commit_list_title \
            /tmp/rn/commit_list \
            /tmp/rn/run_number \
            /tmp/rn/run_url

          echo "=== Release Notes Preview ==="
          head -50 release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag_name }}
          name: ${{ needs.meta.outputs.release_name }}
          body_path: release-notes.md
          prerelease: ${{ needs.meta.outputs.is_prerelease }}
          files: |
            flat/*
          fail_on_unmatched_files: true
          make_latest: ${{ needs.meta.outputs.is_release == 'true' && 'true' || 'false' }}
